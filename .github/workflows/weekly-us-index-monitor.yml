name: Weekly US Index Monitor

on:
  schedule:
    # Run every Monday at 02:00 UTC / 10:00 Asia/Shanghai.
    - cron: '0 2 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/us_index_monitor.json'
      - 'src/markets/**'
      - 'scripts/generate_us_index_weekly.py'
      - 'tests/test_us_index_*.py'
      - '.github/workflows/weekly-us-index-monitor.yml'

concurrency:
  group: horizon-weekly-us-index-monitor
  cancel-in-progress: false

jobs:
  weekly-us-index-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run US index monitor tests
        run: uv run pytest tests/test_us_index_metrics.py tests/test_us_index_monitor.py

      - name: Generate weekly US index monitor
        run: uv run python scripts/generate_us_index_weekly.py

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Weekly US Index Monitor: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
