name: Weekly GitHub Trending Summary

on:
  schedule:
    # Run every Monday at 01:00 UTC / 09:00 Asia/Shanghai.
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours of GitHub trending content to fetch'
        required: false
        default: '168'

concurrency:
  group: horizon-github-trending-weekly
  cancel-in-progress: false

jobs:
  github-trending-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve fetch window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.hours }}" ]; then
            echo "HORIZON_HOURS=${{ github.event.inputs.hours }}" >> "$GITHUB_ENV"
          else
            echo "HORIZON_HOURS=168" >> "$GITHUB_ENV"
          fi

      - name: Generate GitHub trending weekly summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_trending_weekly.py --hours "$HORIZON_HOURS" --limit 25

      - name: Set current week as environment variable
        run: echo "WEEK=$(date +'%G-W%V')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Weekly GitHub Trending Summary: ${{ env.WEEK }}"
          publish_branch: gh-pages
          enable_jekyll: true
