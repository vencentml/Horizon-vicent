name: Weekly Russia-Ukraine War Summary

on:
  schedule:
    # Run every Monday at 02:00 UTC / 10:00 Asia/Shanghai.
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours of Russia-Ukraine war content to fetch'
        required: false
        default: '168'

concurrency:
  group: horizon-ukraine-war-weekly
  cancel-in-progress: false

jobs:
  ukraine-war-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve fetch window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.hours }}" ]; then
            echo "HORIZON_HOURS=${{ github.event.inputs.hours }}" >> "$GITHUB_ENV"
          else
            echo "HORIZON_HOURS=168" >> "$GITHUB_ENV"
          fi

      - name: Generate Russia-Ukraine war weekly summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORIZON_UKRAINE_WEEKLY_MODEL: deepseek-v4-flash
          HORIZON_UKRAINE_WEEKLY_BASE_URL: https://api.deepseek.com
        run: python scripts/ukraine_war_weekly.py --hours "$HORIZON_HOURS" --limit 30

      - name: Set current week as environment variable
        run: echo "WEEK=$(date +'%G-W%V')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Weekly Russia-Ukraine War Summary: ${{ env.WEEK }}"
          publish_branch: gh-pages
          enable_jekyll: true
