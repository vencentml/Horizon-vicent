name: Daily Horizon Summary

on:
  schedule:
    # Run every day at 00:00 UTC / 08:00 Asia/Shanghai.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours of content to fetch'
        required: false
        default: '24'

concurrency:
  group: horizon-daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit generated Pages content

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Resolve fetch window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.hours }}" ]; then
            echo "HORIZON_HOURS=${{ github.event.inputs.hours }}" >> "$GITHUB_ENV"
          else
            echo "HORIZON_HOURS=24" >> "$GITHUB_ENV"
          fi

      - name: Validate Horizon configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path('data/config.json').read_text(encoding='utf-8'))
          print('Config loaded: data/config.json')
          print('AI provider:', config['ai'].get('provider'))
          print('AI model:', config['ai'].get('model'))
          print('AI base_url:', config['ai'].get('base_url'))
          print('Languages:', ', '.join(config['ai'].get('languages', ['en'])))
          print('Webhook enabled:', config.get('webhook', {}).get('enabled'))
          print('RSS sources:', ', '.join(item['name'] for item in config.get('sources', {}).get('rss', [])))
          print('Twitter enabled:', config.get('sources', {}).get('twitter', {}).get('enabled'))

          required = [config['ai'].get('api_key_env')]
          if config.get('sources', {}).get('twitter', {}).get('enabled'):
              required.append(config.get('sources', {}).get('twitter', {}).get('apify_token_env', 'APIFY_TOKEN'))

          missing = [name for name in required if name and not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing required environment variables: ' + ', '.join(missing))

          print('Required environment variables are present.')
          PY

      - name: Run Horizon
        env:
          # data/config.json currently uses provider=openai with a DeepSeek-compatible base_url,
          # so OPENAI_API_KEY should contain your DeepSeek API key unless you change config.json.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours "$HORIZON_HOURS"

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
